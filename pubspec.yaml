
name: eco_tracker
description: "A food CO₂ emission tracking application with Flutter"

# Prevents the project from being published to pub.dev
publish_to: 'none'

# Application version
version: 1.0.0+1

# Dart SDK version
environment:
  sdk: ^3.13.5

# Packages used by the application
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0

  # iOS-style icons
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  image: ^4.12.0

# Packages used for testing and code quality
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Flutter configuration
flutter:
  uses-material-design: true

  assets:
    - assets/products.json
    - assets/recipes.json
    - assets/images/concitologo.svg
    - assets/images/recipes/
